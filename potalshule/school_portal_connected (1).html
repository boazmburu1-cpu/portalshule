async function fn(body){
  const{data,error}=await sb.functions.invoke("admin-users",{body});
  if(error){
    let message=error.message||"The admin-users request failed.";
    try{
      const response=error.context;
      if(response && typeof response.json==="function"){
        const payload=await response.json();
        if(payload?.error)message=payload.error;
      }
      if(response?.status===404)message="The server function admin-users is not deployed. Deploy it with: supabase functions deploy admin-users";
    }catch(_){}
    throw new Error(message);
  }
  if(data?.error)throw new Error(data.error);
  return data;
}

// ----- sign in / register -----

${F?`<div class="msg ${F.k}">${F.t}</div>`:""}<div class="card">${mode==="login"
?`<form onsubmit="H.login(event)"><label style="flex:1 1 100%">Email<input name="email" type="email" required autocomplete="username"></label><label style="flex:1 1 100%">Password<input name="pw" type="password" required autocomplete="current-password"></label><button class="p">Sign in</button></form>`

  const cl=[...new Set(avg.map(r=>r.class_name))].sort(),su=[...new Set(avg.filter(r=>r.subject_name).map(r=>r.subject_name))].sort();

  return`<div class="card"><h2>Class averages</h2>${tbl(["Class",...su,"Total"],cl.map(c=>`<tr><td><b>${esc(c)}</b></td>${su.map(s=>`<td>${g(c,s)}</td>`).join("")}<td><b>${g(c,null)}</b></td></tr>`))}</div>`}
const payRows=l=>l.map(p=>`<tr><td>${when(p.created_at)}</td><td>${esc(p.students?.full_name)}</td><td>${money(p.amount)}</td><td>${p.method}</td><td>${esc(p.reference)}</td></tr>`);

VIEWS.parent=async()=>{
  const[set,kids,sum,marks,att,pays,nts,cls]=await Promise.all([settings(),

    q(sb.from("student_fee_summary").select("*").eq("class_id",ct.class_id))]);
  const pe=sts.filter(s=>s.status==="pending"),ac=sts.filter(s=>s.status==="accepted"),nm=Object.fromEntries(ac.map(s=>[s.id,s.full_name])),owing=sum.filter(s=>s.status==="accepted"&&s.balance>0);
  return`<div class="card"><h2>Students awaiting acceptance (${esc(ct.classes.name)})</h2>${tbl(["Name",""],pe.map(s=>`<tr><td>${esc(s.full_name)}</td><td><button class="s p" onclick="H.decide('${s.id}',true)">Accept</button> <button class="s d" onclick="H.decide('${s.id}',false)">Reject</button></td></tr>`))}</div>
<div class="card"><h2>Attendance</h2><form onsubmit="H.att(event)" style="flex-direction:column;align-items:start"><label>Date<input type="date" name="date" value="${new Date().toISOString().slice(0,10)}" max="${new Date().toISOString().slice(0,10)}" required></label>${ac.map(s=>`<label style="flex-direction:row;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" name="p" value="${s.id}" checked> ${esc(s.full_name)}</label>`).join("")||'<span class="mut">No students yet.</span>'}<button class="p">Save attendance</button></form></div>
<div class="card"><h2>Marks (manual correction)</h2><p class="mut">Subject teachers add marks. You can correct a score here; every correction is recorded.</p>${tbl(["Student","Subject","Score","Review"],marks.filter(m=>nm[m.student_id]).map(m=>`<tr><td>${esc(nm[m.student_id])}</td><td>${esc(m.subjects?.name)}</td><td><input type="number" min="0" max="100" step="0.5" style="width:90px" value="${m.score}" onchange="H.fix('${m.id}',this.value)"></td><td>${esc(m.review)}</td></tr>`))}</div>
<div class="card"><h2>Report remarks</h2>${tbl(["Student","Average","Remark (auto, editable)"],ac.map(s=>{const av=mean(marks.filter(m=>m.student_id===s.id).map(m=>+m.score));return`<tr><td>${esc(s.full_name)}</td><td>${f1(av)}</td><td><input style="width:100%" value="${esc(s.remark||(av==null?"":remark(av)))}" onchange="H.remk('${s.id}',this.value)"></td></tr>`}))}</div>
<div class="card"><h2>Fees for ${esc(ct.classes.name)}</h2>${tbl(["Student","Fee due","Paid","Balance"],sum.filter(s=>s.status==="accepted").map(s=>`<tr><td>${esc(s.full_name)}</td><td>${money(s.total_due)}</td><td>${money(s.total_paid)}</td><td>${money(s.balance)}</td></tr>`))}
<h2 style="margin-top:16px">Update balance (limited)</h2><form onsubmit="H.adj(event)"><label>Student<select name="s">${opts(owing.map(s=>[s.student_id,`${s.full_name} (${money(s.balance)})`]))}</select></label><label>Reduce by (KES)<input name="amt" type="number" min="1" max="${set.adj_max}" required></label><label style="flex:1 1 200px">Reason<input name="why" required></label><button class="p">Update balance</button></form><p class="mut">Limits: ${money(set.adj_max)} per entry and ${money(set.adj_total_max)} per student in total. A reason is required, and every change is recorded for the deputy.</p></div>`};
 
// A teacher account does both jobs: sections appear for whatever the head assigned (a class, subjects, or both).
VIEWS.class_teacher=VIEWS.subject_teacher=async()=>{
  const[c,s]=await Promise.all([classPart(),subjectPart()]);
  return(c+s)||'<div class="msg warn">No class or subjects are assigned to you yet. Ask the head teacher.</div>'};
 
// ===== DEPUTY =====
VIEWS.deputy=async()=>{
  const[avg,sum,parents,pays]=await Promise.all([rpc("class_averages"),
    q(sb.from("student_fee_summary").select("*").gt("balance",0).in("status",["accepted","transferred"]).order("balance",{ascending:false})),
    q(sb.from("profiles").select("id,full_name,phone").eq("role","parent")),
    q(sb.from("payments").select("amount,method,reference,created_at,students(full_name)").order("created_at",{ascending:false}).limit(15))]);
  const pm=Object.fromEntries(parents.map(p=>[p.id,p]));
  return`${avgCard(avg||[])}
<div class="card"><h2>Record a fee payment</h2><form onsubmit="H.pay(event)"><label>Student<select name="s">${opts(sum.map(s=>[s.student_id,`${s.full_name} (${money(s.balance)})`]))}</select></label><label>Method<select name="method"><option value="cheque">Cheque</option><option value="cash">Cash</option></select></label><label>Amount (KES)<input name="amt" type="number" min="1" required></label><label>Cheque / receipt no.<input name="ref" required></label><label style="flex-direction:row;gap:6px;align-items:center"><input type="checkbox" name="ok"> Confirm cash</label><button class="p">Record payment</button></form><p class="mut">Cash is not recommended. Prefer cheque or M-Pesa. Cash needs the confirmation box ticked.</p></div>
<div class="card"><h2>Outstanding fees: prompt parent</h2>${tbl(["Student","Parent","Phone","Balance",""],sum.map(s=>{const p=pm[s.parent_id]||{};return`<tr><td>${esc(s.full_name)}</td><td>${esc(p.full_name)}</td><td>${esc(p.phone)}</td><td>${money(s.balance)}</td><td><button class="s p" onclick="H.prompt('${s.student_id}')">Prompt parent</button></td></tr>`}))}</div>
<div class="card"><h2>Recent fee records</h2>${tbl(payH,payRows(pays))}</div>`};
 
// ===== HEAD =====
VIEWS.head=async()=>{
  const set=await settings();
  const[cls,subj,inv]=await Promise.all([q(sb.from("classes").select("id,name").order("name")),q(sb.from("subjects").select("id,name").order("name")),q(sb.from("staff_invites").select("*").order("created_at",{ascending:false}))]);
  const[allp,pp,avg,sum]=await Promise.all([q(sb.from("profiles").select("id,full_name,phone,email,status").eq("role","parent").order("full_name")),q(sb.from("profiles").select("id,full_name,phone,email").eq("role","parent").eq("status","pending")),rpc("class_averages"),
    q(sb.from("student_fee_summary").select("*").gt("balance",0).order("balance",{ascending:false}))]);
  return`<div class="card"><h2>Parents pending approval (${pp.length})</h2>${tbl(["Name","Phone","Email",""],pp.map(p=>`<tr><td>${esc(p.full_name)}</td><td>${esc(p.phone)}</td><td>${esc(p.email)}</td><td><button class="s p" onclick="H.approve('${p.id}',true)">Approve</button> <button class="s d" onclick="H.approve('${p.id}',false)">Reject</button></td></tr>`))}</div>
<div class="card"><h2>Add a teacher (the admin must approve)</h2><form onsubmit="H.reqTeacher(event)"><label>Full name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Phone<input name="phone"></label><label>Class teacher of<select name="cls"><option value="">Not a class teacher</option>${opts(cls.map(c=>[c.id,c.name]))}</select></label>
<fieldset style="border:1px solid var(--bd);border-radius:8px;flex:1 1 100%"><legend class="mut">Subjects taught</legend>${subj.map(x=>`<label style="flex-direction:row;gap:6px;align-items:center;color:var(--tx);margin-right:10px"><input type="checkbox" name="sub" value="${x.id}"> ${esc(x.name)}</label>`).join("")}</fieldset>
<fieldset style="border:1px solid var(--bd);border-radius:8px;flex:1 1 100%"><legend class="mut">In these classes</legend>${cls.map(c=>`<label style="flex-direction:row;gap:6px;align-items:center;color:var(--tx);margin-right:10px"><input type="checkbox" name="tc" value="${c.id}"> ${esc(c.name)}</label>`).join("")}</fieldset><button class="p">Send for approval</button></form>
<p class="mut">One teacher can be a class teacher and teach subjects too. Nothing is created until the admin approves; the teacher then signs up with this email and confirms it.</p>
${tbl(["Teacher","Email","Duties","Status",""],inv.filter(i=>i.role==="subject_teacher"||i.role==="class_teacher").map(i=>`<tr><td>${esc(i.full_name)}</td><td>${esc(i.email)}</td><td>${esc(duty(i,cls,subj))}</td><td>${tag(INV[i.status])}${i.decision_note?`<div class="mut">${esc(i.decision_note)}</div>`:""}</td><td>${i.status==="pending"?`<button class="s d" onclick="H.cancelInv('${i.id}')">Cancel</button>`:""}</td></tr>`))}</div>
${avgCard(avg||[])}
<div class="card"><h2>Year-end (${set.current_year})</h2><form onsubmit="H.setYE(event)"><label>Year ends on<input type="date" name="d" value="${set.year_end}" required></label><button class="p">Save date</button><button type="button" class="d" onclick="yeAsk=true;render()">Run year-end now</button></form>${yeAsk?`<div class="msg warn" style="margin-top:10px">Promote now? Students with cleared fees move up, others are held, and next year’s fees are issued. This cannot be undone. <button type="button" class="s p" onclick="H.runYE()">Confirm</button> <button type="button" class="s" onclick="yeAsk=false;render()">Cancel</button></div>`:""}<p class="mut">After the year-end date the system promotes students automatically when their fees are cleared. Unpaid fees carry forward, up to ${set.max_arrears_years} years.</p></div>
<div class="card"><h2>Edit parent emails</h2>${tbl(["Parent","Phone","Email (edit)","Status"],allp.map(p=>`<tr><td>${esc(p.full_name)}</td><td>${esc(p.phone)}</td><td><input type="email" style="width:100%" value="${esc(p.email)}" onchange="H.parentEmail('${p.id}',this.value)"></td><td>${tag(p.status)}</td></tr>`))}<p class="mut">After a change the parent signs in with the new email. No confirmation email is sent, so check the address carefully.</p></div>
<div class="card"><h2>Students who have not paid fees</h2>${tbl(["Student","Status","Balance"],sum.map(s=>`<tr><td>${esc(s.full_name)}</td><td>${tag(s.status)}</td><td>${money(s.balance)}</td></tr>`))}</div>`};
 
// ===== ADMIN =====
VIEWS.admin=async()=>{
  const[subj,inv]=await Promise.all([q(sb.from("subjects").select("id,name")),q(sb.from("staff_invites").select("*").order("created_at",{ascending:false}))]);
  const[cls,sts,cts,staff,log]=await Promise.all([q(sb.from("classes").select("id,name,next_class_id,graduates").order("name")),q(sb.from("students").select("class_id,status")),
    q(sb.from("class_teachers").select("class_id,profiles(full_name)")),q(sb.from("profiles").select("id,full_name,email,role,status").neq("role","parent").order("role")),
    q(sb.from("audit_log").select("*").order("created_at",{ascending:false}).limit(15))]);
  const allu=await q(sb.from("profiles").select("id,full_name,email,role").order("full_name"));
  const open=inv.filter(i=>i.status==="pending").length;
  return`<div class="card"><h2>Staff requests (${open} need your approval)</h2>${tbl(["Name","Email","Duties","Status",""],inv.map(i=>`<tr><td>${esc(i.full_name)}</td><td>${esc(i.email)}</td><td>${esc(duty(i,cls,subj))}</td><td>${tag(INV[i.status])}</td><td>${i.status==="pending"?`<button class="s p" onclick="H.decideInv('${i.id}',true)">Approve</button> <button class="s d" onclick="H.decideInv('${i.id}',false)">Reject</button>`:i.status==="approved"?`<button class="s d" onclick="H.cancelInv('${i.id}')">Cancel</button>`:""}</td></tr>`))}
<h2 style="margin-top:16px">Add a head teacher or deputy</h2><form onsubmit="H.leader(event)"><label>Full name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Phone<input name="phone"></label><label>Role<select name="role"><option value="head">Head teacher</option><option value="deputy">Deputy head</option></select></label><button class="p">Approve and invite</button></form><p class="mut">They sign up on the Staff sign-up tab with this email and confirm it.</p></div>
<div class="card"><h2>Classes</h2><form onsubmit="H.addClass(event)"><label>New class name<input name="name" placeholder="e.g. Grade 8A" required></label><button class="p">Add class</button></form>
${tbl(["Class (edit to rename)","Students","Class teacher","Promotes to",""],cls.map(c=>{const nx=c.graduates?"__grad":(c.next_class_id||"");return`<tr><td><input value="${esc(c.name)}" onchange="H.ren('${c.id}',this.value)"></td><td>${sts.filter(s=>s.class_id===c.id&&s.status!=="rejected").length}</td><td>${esc(cts.find(t=>t.class_id===c.id)?.profiles?.full_name||"Not assigned")}</td><td><select onchange="H.nxt('${c.id}',this.value)"><option value="" ${nx===""?"selected":""}>Not set</option>${cls.filter(x=>x.id!==c.id).map(x=>`<option value="${x.id}" ${nx===x.id?"selected":""}>${esc(x.name)}</option>`).join("")}<option value="__grad" ${nx==="__grad"?"selected":""}>Graduates (leaves school)</option></select></td><td><button class="s d" onclick="H.delClass('${c.id}')">Remove</button></td></tr>`}))}
<p class="mut">A class can only be removed when it has no students and no class teacher. Classes with no next class set are never promoted.</p></div>
<div class="card"><h2>Change a user’s password</h2><form onsubmit="H.setPw(event)"><label>User<select name="u">${opts(allu.map(u=>[u.id,`${u.full_name||u.email} (${RN[u.role]}, ${u.email})`]))}</select></label><label>New password (6+ characters)<input name="pw" type="password" minlength="6" required autocomplete="new-password"></label><button class="p">Change password</button></form><p class="mut">Tell the person their new password privately. Anyone already signed in stays signed in until their session ends.</p></div>
<div class="card"><h2>Staff</h2>${tbl(["Name","Email","Role","Status",""],staff.map(p=>`<tr><td>${esc(p.full_name)}</td><td>${esc(p.email)}</td><td>${RN[p.role]}</td><td>${tag(p.status)}</td><td>${p.status==="active"&&p.id!==me.id?`<button class="s d" onclick="H.rm('${p.id}')">Remove</button>`:""}</td></tr>`))}</div>
<div class="card"><h2>Activity log</h2>${tbl(["When","Action","Details"],log.map(l=>`<tr><td>${new Date(l.created_at).toLocaleString("en-KE")}</td><td>${esc(l.action)}</td><td class="mut">${esc(JSON.stringify(l.detail))}</td></tr>`))}</div>`};
 
// ----- actions: each one calls the database, which enforces the rules -----
const H={
  async login(e){const d=fd(e);const{data,error}=await sb.auth.signInWithPassword({email:d.email.trim(),password:d.pw});
    if(error)fl("Wrong email or password.","bad");else{try{await loadMe(data.user.id)}catch(x){fl(esc(x.message),"bad")}}render()},
  async register(e){const d=fd(e);const{error}=await sb.auth.signUp({email:d.email.trim(),password:d.pw,options:{data:{full_name:d.name.trim(),phone:d.phone.trim()}}});
    if(error)fl(/database|already|duplicate/i.test(error.message)?"That email or phone is already registered. One parent uses one account for all their children.":esc(error.message),"bad");
    else{await sb.auth.signOut();mode="login";fl("Registration received. Status: pending head teacher approval.","ok")}render()},
  async staffUp(e){const d=fd(e);const{error}=await sb.auth.signUp({email:d.email.trim(),password:d.pw,options:{data:{full_name:d.name.trim()}}});
    if(error)fl(esc(error.message),"bad");else{await sb.auth.signOut();mode="login";fl("Check your email and confirm your address. Your staff account opens once your invitation is approved.","ok")}render()},
  reqTeacher(e){const d=fd(e),f=e.target,sb2=[...f.querySelectorAll("input[name=sub]:checked")].map(x=>x.value),cs=[...f.querySelectorAll("input[name=tc]:checked")].map(x=>x.value);
    const teaching=sb2.flatMap(s=>cs.map(c=>({subject_id:s,class_id:c})));
    act(()=>rpc("request_teacher",{p_name:d.name.trim(),p_email:d.email.trim(),p_phone:d.phone||null,p_class:d.cls||null,p_teaching:teaching}),"Sent to the admin for approval.")},
  cancelInv(id){act(()=>rpc("cancel_staff_invite",{p_invite:id}),"Request cancelled.")},
  decideInv(id,a){act(()=>rpc("decide_staff_invite",{p_invite:id,p_approve:a,p_note:null}),a?"Approved. The person can now sign up with that email.":"Request rejected.")},
  leader(e){const d=fd(e);act(()=>rpc("admin_invite_leader",{p_name:d.name.trim(),p_email:d.email.trim(),p_phone:d.phone||null,p_role:d.role}),"Invitation approved. They can now sign up with that email.")},
  setPw(e){const d=fd(e);act(()=>fn({action:"set_password",user_id:d.u,password:d.pw}),"Password changed.")},
  parentEmail(id,v){act(()=>fn({action:"set_parent_email",user_id:id,email:v.trim()}),"Parent email updated. They sign in with the new email.")},
  async out(){await sb.auth.signOut();me=null;F=null;render()},
  async mpesa(e){const d=fd(e);
    const{data,error}=await sb.functions.invoke("mpesa-stk-push",{body:{student_id:d.s,phone:d.phone.trim(),amount:+d.amt}});
    if(error||data?.error)fl(esc(data?.error||"M-Pesa is not connected yet. The server function still has to be set up."),"bad");
    else fl("Check your phone and enter your M-Pesa PIN. Then press Refresh to see your updated balance.","ok");render()},
  addKid(e){const d=fd(e);act(()=>q(sb.from("students").insert({full_name:d.name.trim(),class_id:d.cls,parent_id:me.id})),"Student added. The class teacher must accept them.")},
  mark(e){const d=fd(e);act(()=>rpc("save_mark",{p_student:d.s,p_subject:d.sub,p_score:+d.sc,p_review:d.rev||null}),"Marks saved.")},
  rev(id,v){act(()=>rpc("set_mark_review",{p_mark:id,p_review:v}),"Review saved.")},
  decide(id,a){act(()=>rpc("class_decide_student",{p_student:id,p_accept:a}),a?"Student accepted.":"Student rejected.")},
  att(e){const d=fd(e),ids=[...e.target.querySelectorAll("input[name=p]:checked")].map(x=>x.value);act(()=>rpc("save_attendance",{p_date:d.date,p_present:ids}),"Attendance saved.")},
  fix(id,v){act(()=>rpc("class_correct_mark",{p_mark:id,p_score:+v}),"Mark corrected.")},
  remk(id,v){act(()=>rpc("class_set_remark",{p_student:id,p_remark:v}),"Remark saved.")},
  adj(e){const d=fd(e);act(()=>rpc("class_adjust_balance",{p_student:d.s,p_amount:+d.amt,p_reason:d.why}),"Balance updated and recorded.")},
  pay(e){const d=fd(e);act(()=>rpc("record_payment",{p_student:d.s,p_amount:+d.amt,p_method:d.method,p_reference:d.ref,p_confirm_cash:!!d.ok}),"Payment recorded. Parent notified.")},
  prompt(id){act(()=>rpc("prompt_parent",{p_student:id}),"Parent prompted.")},
  approve(id,a){act(()=>rpc("approve_parent",{p_id:id,p_approve:a}),a?"Parent approved.":"Parent rejected.")},
  setYE(e){const d=fd(e);act(()=>rpc("set_year_end",{p_date:d.d}),"Year-end date saved.")},
  runYE(){yeAsk=false;act(async()=>{const r=await rpc("run_year_end",{p_force:true});fl(`Year-end complete: ${r.promoted} promoted, ${r.held} held.`,"ok")})},
  addClass(e){const d=fd(e);act(()=>q(sb.from("classes").insert({name:d.name.trim()})),"Class added.")},
  ren(id,v){act(()=>q(sb.from("classes").update({name:v.trim()}).eq("id",id)),"Class renamed.")},
  nxt(id,v){const u=v==="__grad"?{next_class_id:null,graduates:true}:{next_class_id:v||null,graduates:false};act(()=>q(sb.from("classes").update(u).eq("id",id)),"Promotion path saved.")},
  delClass(id){act(()=>q(sb.from("classes").delete().eq("id",id)),"Class removed.")},
  rm(id){act(()=>rpc("remove_staff",{p_id:id}),"Staff member removed.")}
};
 
// ----- start -----
async function render(){
  const app=$("#app");
  if(!configured){app.innerHTML=setupView();return}
  if(!me){app.innerHTML=authView();return}
  app.innerHTML=shell('<p class="mut">Loading…</p>');
  let body;try{body=await VIEWS[me.role]()}catch(e){body=`<div class="msg bad">${esc(e.message)}</div>`}
  app.innerHTML=shell(body);F=null;
}
(async()=>{
  if(configured){try{const{data:{session}}=await sb.auth.getSession();if(session)await loadMe(session.user.id)}catch(e){}}
  render();
})();
</script></body></html>
